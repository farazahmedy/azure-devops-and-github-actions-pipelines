trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureServiceConnection: 'sc-azure-production'
  resourceGroupName: 'rg-cloud-prod-eastus'
  storageAccountName: 'sttfstateprod001'
  containerName: 'tfstate'
  tfStateKey: 'prod.terraform.tfstate'

stages:
  - stage: Validate
    displayName: 'Stage 1: Lint & Validate'
    jobs:
      - job: ValidateJob
        steps:
          - task: TerraformInstaller@0
            inputs:
              terraformVersion: '1.7.0'
          - script: |
              terraform fmt -check
              terraform init -backend=false
              terraform validate
            displayName: 'Terraform Validate'

  - stage: Plan
    displayName: 'Stage 2: Terraform Plan'
    dependsOn: Validate
    jobs:
      - job: PlanJob
        steps:
          - task: TerraformInstaller@0
            inputs:
              terraformVersion: '1.7.0'
          - task: TerraformTaskV4@4
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              backendServiceArm: '$(azureServiceConnection)'
              backendAzureRmResourceGroupName: '$(resourceGroupName)'
              backendAzureRmStorageAccountName: '$(storageAccountName)'
              backendAzureRmContainerName: '$(containerName)'
              backendAzureRmKey: '$(tfStateKey)'
          - task: TerraformTaskV4@4
            displayName: 'Terraform Plan'
            inputs:
              provider: 'azurerm'
              command: 'plan'
              environmentServiceNameAzureRM: '$(azureServiceConnection)'
              commandOptions: '-out=$(Build.ArtifactStagingDirectory)/tfplan'
          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'tfplan'

  - stage: Apply
    displayName: 'Stage 3: Manual Approval & Apply'
    dependsOn: Plan
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: ApplyJob
        environment: 'production' # Protected by manual approval checks in Azure DevOps
        strategy:
          runOnce:
            deploy:
              steps:
                - task: DownloadBuildArtifacts@0
                  inputs:
                    buildType: 'current'
                    downloadType: 'single'
                    artifactName: 'tfplan'
                    downloadPath: '$(System.ArtifactsDirectory)'
                - task: TerraformInstaller@0
                  inputs:
                    terraformVersion: '1.7.0'
                - task: TerraformTaskV4@4
                  displayName: 'Terraform Apply'
                  inputs:
                    provider: 'azurerm'
                    command: 'apply'
                    environmentServiceNameAzureRM: '$(azureServiceConnection)'
                    commandOptions: '$(System.ArtifactsDirectory)/tfplan/tfplan'
