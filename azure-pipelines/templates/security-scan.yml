parameters:
  - name: targetPath
    type: string
    default: '.'

steps:
  - script: |
      echo "==> Running Gitleaks secret scanner..."
      curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz | tar -xz
      ./gitleaks detect --source=${{ parameters.targetPath }} --verbose
    displayName: 'Scan for Hardcoded Secrets (Gitleaks)'

  - script: |
      echo "==> Running Trivy configuration and vulnerability scan..."
      curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      trivy config ${{ parameters.targetPath }} --severity HIGH,CRITICAL --exit-code 1
    displayName: 'Security Scan (Trivy)'
