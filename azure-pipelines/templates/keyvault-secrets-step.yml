# Reusable Step Template: Fetch Secrets from Azure Key Vault
parameters:
  - name: azureServiceConnection
    type: string
  - name: keyVaultName
    type: string
  - name: secretsFilter
    type: string
    default: '*'

steps:
  - task: AzureKeyVault@2
    displayName: 'Download Secrets from Key Vault (${{ parameters.keyVaultName }})'
    inputs:
      azureSubscription: '${{ parameters.azureServiceConnection }}'
      KeyVaultName: '${{ parameters.keyVaultName }}'
      SecretsFilter: '${{ parameters.secretsFilter }}'
      RunAsPreJob: false

  - script: |
      echo "==> Successfully downloaded and mapped secrets from Azure Key Vault."
      echo "All retrieved secret values are automatically masked and protected by the Azure Pipelines agent."
    displayName: 'Validate Key Vault Secret Download'
