# DevSecOps Step Template: Secret Scanning with Gitleaks
parameters:
  - name: failOnLeak
    type: boolean
    default: true
  - name: scanPath
    type: string
    default: '.'

steps:
  - script: |
      echo "=========================================================="
      echo "🔍 [DevSecOps] Step 1: Secret Scanning with Gitleaks"
      echo "=========================================================="
      # Download official Gitleaks binary
      curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz | tar -xz
      chmod +x gitleaks

      # Run Gitleaks detect with SARIF and JSON reporting
      ./gitleaks detect \
        --source=${{ parameters.scanPath }} \
        --report-format=json \
        --report-path=$(Build.ArtifactStagingDirectory)/gitleaks-report.json \
        --verbose \
        --redact

      EXIT_CODE=$?
      if [ $EXIT_CODE -ne 0 ] && [ "${{ parameters.failOnLeak }}" = "True" ]; then
        echo "🚨 CRITICAL: Hardcoded secrets or credentials detected in repository!"
        exit 1
      fi
    displayName: 'Run Gitleaks Secret Scanner'

  - task: PublishBuildArtifacts@1
    displayName: 'Publish Gitleaks Security Report'
    condition: always()
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/gitleaks-report.json'
      ArtifactName: 'Security-Reports'
