name: "Deploy with Azure Key Vault Secrets"

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: "Deploy using Key Vault Secrets & OIDC"
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 1: Passwordless OIDC Login to Azure
      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Step 2: Dynamically Retrieve Secrets from Azure Key Vault
      - name: Fetch Secrets from Azure Key Vault
        uses: azure/get-keyvault-secrets@v1
        with:
          keyvault: "kv-cloud-prod-eastus"
          secrets: 'DbConnectionString, ApiKey, TlsCert'
        id: keyvault-secrets

      # Step 3: Connect to AKS Cluster
      - name: Set AKS Context
        uses: azure/aks-set-context@v4
        with:
          resource-group: 'rg-cloud-prod-eastus'
          cluster-name: 'aks-cloud-prod'

      # Step 4: Deploy Helm Release with Key Vault Injected Secret
      - name: Deploy Helm Chart with Injected Secret
        run: |
          helm upgrade --install cloud-app ./charts/app \
            --namespace production \
            --create-namespace \
            --set image.tag=${{ github.sha }} \
            --set database.secretConnectionString="${{ steps.keyvault-secrets.outputs.DbConnectionString }}" \
            --atomic \
            --timeout 5m
